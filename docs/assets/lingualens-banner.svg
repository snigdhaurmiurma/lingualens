<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#18182E" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="180" fill="url(#accent-glow)" />
  <circle cx="1050" cy="280" r="220" fill="url(#accent-glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="360" rx="16" fill="none" stroke="#374151" stroke-width="1" stroke-opacity="0.6" />

  <!-- Tag Pill -->
  <g transform="translate(80, 80)">
    <rect width="250" height="32" rx="16" fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="16" r="5" fill="#10B981" />
    <text x="36" y="21" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">EMPIRICAL IR RESEARCH MVP</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="180" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Lingua<tspan fill="url(#primary-grad)">Lens</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="225" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.3">
    Multilingual Search Fairness &amp; Semantic Evaluation Platform
  </text>

  <!-- Description snippet -->
  <text x="80" y="262" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Quantifying cross-lingual degradation, transliteration penalties, and subword fertility
  </text>
  <text x="80" y="286" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    across English, Bengali, Banglish, Hindi, and Arabic with bootstrap paired significance.
  </text>

  <!-- Language Script Badges -->
  <g transform="translate(80, 320)">
    <!-- English -->
    <rect x="0" y="0" width="85" height="28" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <text x="42" y="18" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">EN · Latin</text>

    <!-- Bengali -->
    <rect x="95" y="0" width="95" height="28" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <text x="142" y="18" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BN · বাংলা</text>

    <!-- Banglish -->
    <rect x="200" y="0" width="115" height="28" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <text x="257" y="18" fill="#A78BFA" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BN-Latn · Translit</text>

    <!-- Hindi -->
    <rect x="325" y="0" width="95" height="28" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <text x="372" y="18" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">HI · हिन्दी</text>

    <!-- Arabic -->
    <rect x="430" y="0" width="95" height="28" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <text x="477" y="18" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AR · العربية</text>
  </g>

  <!-- Right Decorative Icon Symbol -->
  <g transform="translate(940, 100)">
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#1F2937" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 90 40 C 62.38 40 40 62.38 40 90 C 40 117.61 62.38 140 90 140 C 117.61 140 140 117.61 140 90 C 140 62.38 117.61 40 90 40 Z" fill="none" stroke="#A78BFA" stroke-width="6" />
    <path d="M 45 90 L 135 90" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" />
    <path d="M 90 45 L 90 135" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" />
    <circle cx="90" cy="90" r="14" fill="#7C3AED" />
  </g>
</svg>
