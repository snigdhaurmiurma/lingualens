<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="600" fill="url(#bg)" />

  <!-- Section Header -->
  <text x="60" y="55" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">END-TO-END PIPELINE TRANSITIONS</text>
  <text x="60" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">How LinguaLens Evaluates Multilingual Search</text>

  <!-- Step 1: Input Query & Script Selection -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="245" height="420" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="1" />
    <rect x="0" y="0" width="245" height="4" rx="2" fill="#7C3AED" />
    
    <!-- Step Badge -->
    <rect x="18" y="20" width="60" height="22" rx="4" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="1" />
    <text x="48" y="35" fill="#A78BFA" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 01</text>
    
    <text x="18" y="70" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Multilingual Query</text>
    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Script &amp; Language Matrix</text>

    <!-- Query Box Simulation -->
    <rect x="18" y="115" width="209" height="75" rx="8" fill="#0B0F19" stroke="#4B5563" stroke-width="1" />
    <text x="28" y="138" fill="#10B981" font-family="monospace" font-size="10">LANG: bn (Bengali)</text>
    <text x="28" y="162" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">কৃষি ক্ষেত্রে জলবায়ু...</text>

    <!-- Parallel Script Chips -->
    <text x="18" y="215" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">PARALLEL INTENTS:</text>
    
    <g transform="translate(18, 230)">
      <rect width="209" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="10" y="18" fill="#E2E8F0" font-family="monospace" font-size="11">en: climate change...</text>
    </g>
    <g transform="translate(18, 266)">
      <rect width="209" height="28" rx="6" fill="#111827" stroke="#7C3AED" stroke-width="1" />
      <text x="10" y="18" fill="#A78BFA" font-family="monospace" font-size="11">bn-Latn: krishi khetre...</text>
    </g>
    <g transform="translate(18, 302)">
      <rect width="209" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="10" y="18" fill="#E2E8F0" font-family="monospace" font-size="11">hi: कृषि पर जलवायु...</text>
    </g>
    <g transform="translate(18, 338)">
      <rect width="209" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="199" y="18" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="end">ar: تغير المناخ الزراعة</text>
    </g>

    <text x="18" y="395" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" italic="true">Detects writing direction &amp; script</text>
  </g>

  <!-- Transition Arrow 1 -->
  <path d="M 315 330 L 340 330" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" />
  <polygon points="345,330 335,324 335,336" fill="#7C3AED" />

  <!-- Step 2: Tokenizer Fragmentation & Fertility -->
  <g transform="translate(350, 120)" filter="url(#shadow)">
    <rect width="245" height="420" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="1" />
    <rect x="0" y="0" width="245" height="4" rx="2" fill="#3B82F6" />

    <rect x="18" y="20" width="60" height="22" rx="4" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1" />
    <text x="48" y="35" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 02</text>

    <text x="18" y="70" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Subword Inspector</text>
    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Vocabulary Fragmentation</text>

    <!-- Subword Tokens Chips -->
    <rect x="18" y="115" width="209" height="120" rx="8" fill="#0B0F19" stroke="#4B5563" stroke-width="1" />
    <text x="28" y="135" fill="#94A3B8" font-family="monospace" font-size="10">SUBWORD CHIPS:</text>
    
    <g transform="translate(28, 148)">
      <rect width="42" height="22" rx="4" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1" />
      <text x="21" y="15" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">কৃষি</text>

      <rect x="48" width="46" height="22" rx="4" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1" />
      <text x="71" y="15" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">ক্ষে</text>

      <rect x="100" width="46" height="22" rx="4" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1" />
      <text x="123" y="15" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">##ত্রে</text>
    </g>

    <g transform="translate(28, 178)">
      <rect width="52" height="22" rx="4" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1" />
      <text x="26" y="15" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">জলবা</text>

      <rect x="58" width="38" height="22" rx="4" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1" />
      <text x="77" y="15" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">##য়ু</text>

      <rect x="102" width="48" height="22" rx="4" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1" />
      <text x="126" y="15" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">##র</text>
    </g>

    <!-- Fertility Metric Display -->
    <rect x="18" y="250" width="209" height="75" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="28" y="272" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Fertility Ratio:</text>
    <text x="28" y="304" fill="#60A5FA" font-family="monospace" font-size="24" font-weight="700">2.67x</text>
    <text x="105" y="300" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">(EN: 1.25x)</text>

    <!-- Unknown token audit -->
    <g transform="translate(18, 338)">
      <rect width="209" height="32" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1" />
      <text x="10" y="20" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">✓ 0 [UNK] Tokens Found</text>
    </g>

    <text x="18" y="395" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" italic="true">Audits representation dilation</text>
  </g>

  <!-- Transition Arrow 2 -->
  <path d="M 605 330 L 630 330" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
  <polygon points="635,330 625,324 625,336" fill="#3B82F6" />

  <!-- Step 3: Dual-Mode Vector Retrieval -->
  <g transform="translate(640, 120)" filter="url(#shadow)">
    <rect width="245" height="420" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="1" />
    <rect x="0" y="0" width="245" height="4" rx="2" fill="#10B981" />

    <rect x="18" y="20" width="60" height="22" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="48" y="35" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 03</text>

    <text x="18" y="70" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Vector Retrieval</text>
    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Dense 384d Cosine Search</text>

    <!-- Adapter Selected -->
    <rect x="18" y="115" width="209" height="48" rx="8" fill="#0B0F19" stroke="#374151" stroke-width="1" />
    <text x="28" y="133" fill="#94A3B8" font-family="monospace" font-size="10">ADAPTER:</text>
    <text x="28" y="151" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="600">MiniLM-L12 (384d)</text>

    <!-- Dual Mode Switch -->
    <rect x="18" y="175" width="209" height="70" rx="8" fill="#111827" stroke="#10B981" stroke-width="1" />
    <text x="28" y="195" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ACTIVE: EXACT MODE</text>
    <text x="28" y="215" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">NumPy Matrix Cosine Sim</text>
    <text x="28" y="233" fill="#64748B" font-family="monospace" font-size="10">Optional: pgvector HNSW</text>

    <!-- Candidate Results Mini List -->
    <text x="18" y="270" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">TOP CANDIDATES:</text>
    
    <g transform="translate(18, 285)">
      <rect width="209" height="26" rx="4" fill="#0B0F19" stroke="#374151" stroke-width="1" />
      <text x="8" y="17" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">#1 (0.892)</text>
      <text x="75" y="17" fill="#E2E8F0" font-family="monospace" font-size="10">doc-bn-01</text>
    </g>
    <g transform="translate(18, 317)">
      <rect width="209" height="26" rx="4" fill="#0B0F19" stroke="#374151" stroke-width="1" />
      <text x="8" y="17" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">#2 (0.835)</text>
      <text x="75" y="17" fill="#E2E8F0" font-family="monospace" font-size="10">doc-bn-04</text>
    </g>
    <g transform="translate(18, 349)">
      <rect width="209" height="26" rx="4" fill="#0B0F19" stroke="#374151" stroke-width="1" />
      <text x="8" y="17" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="700">#3 (0.761)</text>
      <text x="75" y="17" fill="#E2E8F0" font-family="monospace" font-size="10">doc-en-02</text>
    </g>

    <text x="18" y="395" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" italic="true">Latency: 12.5 ms (CPU)</text>
  </g>

  <!-- Transition Arrow 3 -->
  <path d="M 895 330 L 920 330" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <polygon points="925,330 915,324 915,336" fill="#10B981" />

  <!-- Step 4: Fairness & Disparity Evaluation -->
  <g transform="translate(930, 120)" filter="url(#shadow)">
    <rect width="210" height="420" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="1" />
    <rect x="0" y="0" width="210" height="4" rx="2" fill="#F59E0B" />

    <rect x="18" y="20" width="60" height="22" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
    <text x="48" y="35" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 04</text>

    <text x="18" y="70" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Fairness Metrics</text>
    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Bootstrap Significance</text>

    <!-- Disparity Metrics -->
    <rect x="18" y="115" width="174" height="65" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="26" y="135" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">nDCG@10 Disparity (RDR):</text>
    <text x="26" y="165" fill="#FBBF24" font-family="monospace" font-size="20" font-weight="700">0.782</text>
    <text x="95" y="163" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="11">(-21.8%)</text>

    <!-- Transliteration Script Penalty -->
    <rect x="18" y="190" width="174" height="65" rx="8" fill="#111827" stroke="#EF4444" stroke-width="1" />
    <text x="26" y="210" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="10">Banglish Penalty (TSP):</text>
    <text x="26" y="240" fill="#EF4444" font-family="monospace" font-size="20" font-weight="700">31.4%</text>

    <!-- Statistical Significance Box -->
    <rect x="18" y="265" width="174" height="85" rx="8" fill="#0B0F19" stroke="#374151" stroke-width="1" />
    <text x="26" y="285" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">STATISTICAL RIGOR:</text>
    <text x="26" y="305" fill="#E2E8F0" font-family="monospace" font-size="11">95% CI: [0.71, 0.85]</text>
    <text x="26" y="325" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">Wilcoxon: p &lt; 0.05 *</text>
    <text x="26" y="340" fill="#64748B" font-family="monospace" font-size="9">Statistically Significant</text>

    <text x="18" y="395" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" italic="true">Audit validated &amp; exported</text>
  </g>
</svg>
